name: Django CI
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Set up Python environment
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}

      # Install Redis CLI for testing with Redis
      - name: Install Redis CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-tools

      # Install dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Set up the database (migrations)
      - name: Set up database (testing)
        run: |
          yes "y" | python manage.py makemigrations --merge
          python manage.py migrate

      # Wait for Redis to be ready
      - name: Wait for Redis to be Ready
        run: |
          for i in {1..10}; do redis-cli ping && break || sleep 5; done

      # Verify the Redis connection
      - name: Verify Redis Connection
        run: |
          python -c "import redis; r = redis.Redis(host='localhost', port=6379); assert r.ping()"
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379


      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18  # Adjust as needed

      - name: Install Node.js dependencies
        run: npm install

      - name: Run Jest Tests
        run: npm test
        

      # Install Chromium and ChromeDriver
      - name: Install Chromium and ChromeDriver

        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          CHROMEDRIVER_VERSION=$(curl -sS chromedriver.storage.googleapis.com/LATEST_RELEASE)
          wget https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip
          unzip -q chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/chromedriver
          sudo chmod +x /usr/local/bin/chromedriver

      # Run non-Selenium tests
      - name: Run Non-Selenium and Non-Jest Tests
        run: |
          python manage.py test user_management
          python manage.py test poll_management
          python manage.py test question_management
          python manage.py test response_management
          python manage.py test analytics
          python manage.py test system_components
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      # Run Selenium Tests
      - name: Run Selenium Tests
        run: |
          python manage.py test Quizmos.selenium_tests
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          DISPLAY: :99.0  # For headless mode

