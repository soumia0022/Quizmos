<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Question</title>
    {% load static %}
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/script.js' %}"></script>  <!-- JavaScript -->
</head>
<body>
    <h1>{{ poll.title }}</h1>

    <button id="add-question-btn">Add Question</button>

    <!-- Form to add question (hidden initially) -->
    <div id="question-form" style="display: none;">
        <form method="POST">
            {% csrf_token %}

            <!-- Dropdown for selecting question type (visible initially) -->
            <label for="question_type">Question Type:</label>
            <select name="question_type" id="question-type-dropdown" required>
                <option value="">-- Select Type --</option>
                <option value="multiple_choice">Multiple Choice</option>
                <option value="single_choice">Single Choice</option>
                <option value="text_fill">Text Fill in the Blank</option>
                <option value="dropdown_fill">Dropdown Fill in the Blank</option>
            </select>

            <!-- Below fields hidden until option for them is clicked in drop-down (using style display none) -->

            <!-- Text Fill Fields -->
            <div id="text-fill-fields" style="display: none;">
                <input type="text" name="text_fill_question" placeholder="Enter Text Fill Question" />
                <input type="text" name="text_fill_answer" placeholder="Enter Text Fill Answer" />
            </div>

            <!-- Dropdown Fill Fields -->
            <div id="dropdown-fill-fields" style="display: none;">
                <input type="text" name="dropdown_fill_question" placeholder="Enter Dropdown Fill Question" />
                <input type="text" name="dropdown_options" placeholder="Comma separated options" />
            </div>

            <!-- Multiple Choice Fields -->
            <div id="multiple-choice-fields" style="display: none;">
                <input type="text" name="multiple_choice_question" placeholder="Enter Multiple Choice Question" />
                <!-- Dynamically add options -->
                <div id="options-section">
                    <button type="button" id="add-option-btn"> Add Option </button>

                    <div id="options-container">
                        <!-- Dynamically add options with javascript-->
                    </div>
                </div>
            </div>

            <!-- Single Choice Fields -->
            <div id="single-choice-fields" style="display: none;">
                <input type="text" name="single_choice_question" placeholder="Enter Single Choice Question" />
                <input type="text" name="single_choice_option" placeholder="Single option" />
            </div>

            <button type="submit">Save Question</button>
        </form>
    </div>

    <!-- Sidebar to display created questions -->
    <div id="questions-sidebar">
        <h3>Questions Created:</h3>
        <div id="questions-list">
            <!-- questions list in the sidebar -->
            {% for question in poll.questions.all %}
                <div class="question-item">
                    Question {{ forloop.counter }}: {{ question.question_text }}
                </div>
            {% empty %}
                <p>No questions created yet.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
