<!DOCTYPE html>
<html lang="en">
<head>
    <title>Add Question</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"> <!-- Bootstrap -->
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <script src="{% static 'js/script.js' %}"></script> <!-- JavaScript -->
</head>
<body>

    <!-- Stars -->
    <div class="star" style="top: 50px; left: 100px;"></div>
    <div class="star" style="top: 200px; left: 300px;"></div>
    <div class="star" style="top: 400px; left: 50px;"></div>
    <div class="star" style="top: 75px; left: 90px;"></div>
    <div class="star" style="top: 250px; left: 310px;"></div>
    <div class="star" style="top: 440px; left: 400px;"></div>
    <div class="star" style="top: 60px; left: 650px;"></div>
    <div class="star" style="top: 230px; left: 800px;"></div>
    <div class="star" style="top: 480px; left: 900px;"></div>
    <div class="star" style="top: 95px; left: 378px;"></div>
    <div class="star" style="top: 479px; left: 700px;"></div>
    <div class="star" style="top: 321px; left: 850px;"></div>
    <div class="star" style="top: 50px; left: 100px;"></div>
    <div class="star" style="top: 200px; left: 300px;"></div>
    <div class="star" style="top: 400px; left: 50px;"></div>
    <div class="star" style="top: 120px; left: 400px;"></div>
    <div class="star" style="top: 300px; left: 600px;"></div>
    <div class="star" style="top: 500px; left: 800px;"></div>
    <div class="star" style="top: 50px; left: 700px;"></div>
    <div class="star" style="top: 180px; left: 250px;"></div>
    <div class="star" style="top: 320px; left: 420px;"></div>
    <div class="star" style="top: 600px; left: 550px;"></div>
    <div class="star" style="top: 100px; left: 900px;"></div>
    <div class="star" style="top: 450px; left: 150px;"></div>
    <div class="star" style="top: 220px; left: 770px;"></div>
    <div class="star" style="top: 650px; left: 300px;"></div>
    <div class="star" style="top: 700px; left: 80px;"></div>
    <div class="star" style="top: 50px; left: 50px;"></div>
    <div class="star" style="top: 250px; left: 1000px;"></div>
    <div class="star" style="top: 400px; left: 850px;"></div>
    <div class="star" style="top: 150px; left: 200px;"></div>
    <div class="star" style="top: 550px; left: 720px;"></div>


    <div class="container-fluid mt-2 text-center">
        <div class="row justify-content-center align-items-center mb-3">
            <div class="col-auto">
                <h1 class="mb-3">{{ poll.title }}</h1>
            </div>
            <div class="col-auto">
                <button id="add-question-btn" class="btn btn-primary">Add Question</button>
            </div>
        </div>
    </div>

    <div class="container-fluid">
        <div class="row">
            <!-- Main Content -->
            <div id="main-content"  class="col-lg-8 col-md-7 mb-4">
                <!-- Form to Add Question (hidden initially) -->
                <div class="card" id="question-form" style="display: none;">
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <!-- Dropdown for selecting question type -->
                            <div class="mb-3">
                                <label for="question_type" class="form-label">Question Type:</label>
                                <select name="question_type" id="question-type-dropdown" class="form-select" required>
                                    <option value="">-- Select Type --</option>
                                    <option value="multiple_choice">Multiple Choice</option>
                                    <option value="single_choice">Single Choice</option>
                                    <option value="text_fill">Text Answer</option>
                                    <option value="dropdown_fill">Dropdown Fill in the Blank</option>
                                </select>
                            </div>

                            <!-- Text Fill Fields -->
                            <div id="text-fill-fields" class="mb-3" style="display: none;">
                                <input type="text" name="text_fill_question" class="form-control mb-2" placeholder="Enter Text Question">
                                <input type="text" name="text_fill_answer" class="form-control" placeholder="Enter Text Answer">
                            </div>

                            <!-- Dropdown Fill Fields -->
                            <div id="dropdown-fill-fields" class="mb-3" style="display: none;">
                                <textarea name="dropdown_fill_question" id="dropdown-fill-input" class="form-control mb-2" placeholder="Enter Dropdown Fill Question"></textarea>
                                <div id="text-preview" class="mb-3 border p-2"></div> <!-- Preview area for the text -->

                                <label for="dropdown-correct-answer" class="form-label">Correct Answer:</label>
                                <input type="text" name="dropdown_correct_answer" id="dropdown-correct-answer" class="form-control mb-2" placeholder="Select a word to use as the blank" readonly>

                                <label for="additional-options" class="form-label">Additional Options:</label>
                                <input type="text" name="additional_options" class="form-control mb-2" placeholder="Option 1">
                                <input type="text" name="additional_options" class="form-control mb-2" placeholder="Option 2">
                                <input type="text" name="additional_options" class="form-control mb-2" placeholder="Option 3">
                                <button type="button" id="reset-preview-btn" class="btn btn-secondary mt-2">Reset</button>
                            </div>

                            <!-- Multiple Choice Fields -->
                            <div id="multiple-choice-fields" class="mb-3" style="display: none;">
                                <input type="text" name="multiple_choice_question" class="form-control mb-2" placeholder="Enter Multiple Choice Question">
                                <div id="options-section" class="mt-2">
                                    <button type="button" id="multiple-choice-add-option-btn" class="btn btn-outline-primary mb-2">Add Option</button>
                                    <div id="multiple-choice-options-container"></div>
                                </div>
                            </div>

                            <!-- Single Choice Fields -->
                            <div id="single-choice-fields" class="mb-3" style="display: none;">
                                <input type="text" name="single_choice_question" class="form-control mb-2" placeholder="Enter Single Choice Question">
                                <div id="options-section" class="mt-2">
                                    <button type="button" id="single-choice-add-option-btn" class="btn btn-outline-primary mb-2">Add Option</button>
                                    <div id="single-choice-options-container"></div>
                                </div>
                            </div>

                            <!-- Save Question Button -->
                            <div class="text-center">
                                <button type="submit" class="btn btn-success">Save Question</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Sidebar for Created Questions -->
            <div class="col-lg-4 col-md-5">
                <div id="questions-sidebar" class="border rounded bg-light p-3">
                    <h3 class="text-center">Questions Created:</h3>
                    <div id="questions-list">
                        {% for question in poll.questions.all %}
                            <div class="question-item mb-2">
                                <strong>Question {{ forloop.counter }}:</strong> {{ question.question_text }}
                            </div>
                        {% empty %}
                            <p class="text-muted text-center">No questions created yet.</p>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script> <!-- Bootstrap JavaScript -->
</body>
</html>
