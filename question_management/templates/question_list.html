{% load static %}

<html>
<head>
    <title>Questions</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="{% static 'js/question_list.js' %}"></script>  <!-- Link to external JavaScript -->
</head>
<body>
    <h1>Questions</h1>
    <ul>
        {% for question in questions %}
            <li class="question-item" data-id="{{ question.id }}">{{ question.question_text }}</li>
        {% endfor %}
    </ul>
    <div id="preview-box"></div>
</body>
</html>
