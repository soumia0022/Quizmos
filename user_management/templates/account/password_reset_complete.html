<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
  </head>
  <body>
    <h1>{{ title }}</h1>
    {% if error_message %}
      <p class="error">{{ error_message }}</p>
    {% else %}
      <p>No error message</p>
    {% endif %}
    {% if validlink %}
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Change Password</button>
      </form>
    {% else %}
      <p>Link is not valid</p>
    {% endif %}
  </body>
</html>
