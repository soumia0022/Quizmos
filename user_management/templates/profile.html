{% extends 'base_content.html' %}
{% load system_extras %}
{% load static %}
{% block content %}
<div class="container py-4">

  {% go_back_button %}

  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Edit Profile</h2>

        <div class="text-center mb-3">
            <img src="https://api.dicebear.com/9.x/shapes/svg?seed={{ user.username }}&radius=50&backgroundColor=0a5b83"
                 alt="User Avatar" class="rounded-circle shadow" width="100">
          </div>

        <form action="{% url 'user_management:profile' %}" method="post" class="needs-validation" novalidate>
          {% csrf_token %}
          {% include 'partials/bootstrap_form.html' with form=form exclude="profile_picture" %}


          <!-- Submit Button -->
          <div class="text-center">
            <button type="submit" class="btn btn-primary w-100">Update Profile</button>
          </div>
        </form>
      </div>
    </div>
  </div>

</div>

<script src="{% static 'js/profile_picture_preview.js' %}"></script>
{% endblock %}
