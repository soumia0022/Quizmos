<div class="pagination">
    <span class="step-links">
        {% if polls.has_previous %}
            <a href="?page=1{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">&laquo; first</a>
            <a href="?page={{ polls.previous_page_number }}{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">previous</a>
        {% endif %}

        <span class="current">
            Page {{ polls.number }} of {{ polls.paginator.num_pages }}.
        </span>

        {% if polls.has_next %}
            <a href="?page={{ polls.next_page_number }}{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">next</a>
            <a href="?page={{ polls.paginator.num_pages }}{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">last &raquo;</a>
        {% endif %}
    </span>
</div>
</div>
