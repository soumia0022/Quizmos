<div class="pagination">
    <span class="step-links">
        {% if polls.has_previous %}
            <a href="?{{ page_param|default:"page" }}=1&view={{ view }}{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">&laquo; first</a>
            <a href="?{{ page_param|default:"page" }}={{ polls.previous_page_number }}&view={{ view }}{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">previous</a>
        {% endif %}

        <span class="current">
            Page {{ polls.number }} of {{ polls.paginator.num_pages }}
        </span>

        {% if polls.has_next %}
            <a href="?{{ page_param|default:"page" }}={{ polls.next_page_number }}&view={{ view }}{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">next</a>
            <a href="?{{ page_param|default:"page" }}={{ polls.paginator.num_pages }}&view={{ view }}{% if search_query %}&search={{ search_query }}{% endif %}{% if sort_by %}&sort_by={{ sort_by }}{% endif %}">last &raquo;</a>
        {% endif %}
    </span>
</div>
