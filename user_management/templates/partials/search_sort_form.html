<form method="GET" class="search-sort-form">
    <input type="text" name="search" placeholder="Search polls..." value="{{ search_query }}" class="form-control search-input">
    <select name="sort_by" onchange="this.form.submit()" class="form-control sort-select">
        <option value="title_asc" {% if sort_by == "title_asc" %}selected{% endif %}>A-Z</option>
        <option value="title_desc" {% if sort_by == "title_desc" %}selected{% endif %}>Z-A</option>
        {% if user.role == "Lecturer" %}
            <option value="created_at_asc" {% if sort_by == "created_at_asc" %}selected{% endif %}>Oldest First</option>
            <option value="created_at_desc" {% if sort_by == "created_at_desc" %}selected{% endif %}>Newest First</option>
        {% endif %}
    </select>
    <button type="submit" class="btn btn-secondary apply-btn">Apply</button>
</form>
