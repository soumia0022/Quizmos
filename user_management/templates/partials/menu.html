{% load static %}
<div class="collapse navbar-collapse" id="navbarSupportedContent">
  <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
    <li class="nav-item dropdown profile-icon">
      {% if user.is_authenticated %}
      <a class="nav-link dropdown-toggle" href="#" id="user-account-dropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <img src="https://api.dicebear.com/9.x/shapes/svg?seed={{ user.username }}&radius=50&backgroundColor=0a5b83"
             alt="User Avatar" class="rounded-circle shadow" width="40">
      </a>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="user-account-dropdown">
        {% if user.first_name and user.first_name != "Guest" %}
        <li><a class="dropdown-item" href="{% url 'user_management:profile' %}">Change profile</a></li>
        <li><a class="dropdown-item" href="{% url 'user_management:password' %}">Change password</a></li>
        <li><hr class="dropdown-divider"></li>
        {% endif %}

        {% if user.first_name != "Guest" %}
          <li><a class="dropdown-item" href="{% url 'user_management:log_out' %}">Log out</a></li>
        {% endif %} 
             
      </ul>

      {% else %}
      <span class="bi-person-circle" style="font-size: 30px;"></span>
      {% endif %}
    </li>
  </ul>
</div>
