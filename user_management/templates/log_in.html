{% extends 'base_pre_login.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/form.css' %}">
<link rel="stylesheet" href="{% static 'css/custom.css' %}">
<link rel="stylesheet" href="{% static 'css/login.css' %}">

<div class="login-page">
  <div class="background-wrapper">
    {% include 'partials/login_background.html' %}
  </div>
  
  <div class="container">
    <div class="row">
      <div class="col-sm-12 col-md-6 offset-md-3">
        <form action="{% url 'user_management:log_in' %}" method="post">
          <h1>Log in</h1>
          {% csrf_token %}
          <input type="hidden" name="next" value="{{ next }}">
          {% include 'partials/bootstrap_form.html' with form=form %}
          <input id="id_log_in_button" type="submit" value="Log in" class="btn btn-primary">
          <div class="prompt">
            Don't have an account? <a href="{% url 'user_management:sign_up' %}">Sign up</a>
          </div>
          <div class="prompt">
            <a href="{% url 'user_management:password_reset' %}">Forgotten Password?</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
