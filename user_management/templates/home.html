{% extends 'base.html' %}
{% load static %}
{% block body %}

<link rel="stylesheet" href="{% static 'css/base.css' %}">
<link rel="stylesheet" href="{% static 'css/home.css' %}">

{% include 'partials/home_navbuttons.html' %}

<div class="stars" id="stars-container"></div>
<div id="meteors-container"></div>
<div class="container vh-100 d-flex align-items-center justify-content-center">
    <div class="row w-100">
        <div class="col-12 d-flex justify-content-center">
            <div class="card cover-card">
                <h1 class="cover-heading">Quizmos</h1>
      
                
                <div class="poll-code">
                    <h2 class="h4 mb-3">Join Poll</h2>
                    <form method="post" action="{% url 'user_management:home' %}">
                        {% csrf_token %}
                        <div class="form-group">
                            {{ form.poll_code }}
                        </div>
                        {% if form.errors %}
                        <div class="alert alert-danger mt-2">
                            {{ form.errors.poll_code|striptags }}
                        </div>
                        {% endif %}
                        <button type="submit" class="btn btn-secondary btn-block mt-3">Join</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>


{% include 'partials/footer.html' %}

<script src="{% static 'js/space_animation.js' %}"></script>
{% endblock %}
