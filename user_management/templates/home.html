{% extends 'base.html' %}
{% block body %}
 <body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-light bg-light justify-content-end">
        <div>
            <a href="{% url 'sign_up' %}" class="btn btn-secondary">Sign up</a>
            <a href="{% url 'log_in' %}" class="btn btn-secondary ml-2">Log in</a>
        </div>
    </nav>
    <div class="container d-flex flex-column justify-content-center align-items-center flex-grow-1">
        <div class="text-center">
            <h1 class="mb-4">Quizmos</h1>
            <div class="card p-4" style="width: 100%; max-width: 400px;">
                <h2 class="text-center">Join Poll</h2>
                <!-- Form to join a poll by entering a code -->
                <form method="post" action="{% url 'home' %}">
                    {% csrf_token %}
                    <div class="form-group">
                        {{ form.poll_code }}
                    </div>
                    {% if form.errors %}
                        <div class="alert alert-danger mt-2">
                            {{ form.errors.poll_code|striptags }}
                        </div>
                    {% endif %}
                    <button type="submit" class="btn btn-primary btn-block">Join</button>
                </form>
            </div>
        </div>
    </div>


{% endblock %}
