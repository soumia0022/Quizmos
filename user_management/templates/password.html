{% extends 'base_content.html' %}
{% load system_extras %}
{% load static %}

{% block content %}

<link rel="stylesheet" href="{% static 'css/custom.css' %}">
<link rel="stylesheet" href="{% static 'css/profile.css' %}">

<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card profile-card shadow-lg p-4">
        <h2 class="text-center mb-4 profile-heading">Change Password</h2>
        <form action="{% url 'user_management:password' %}" method="post" class="needs-validation" novalidate>
          {% csrf_token %}
          {% include 'partials/bootstrap_form.html' with form=form %}
          <div class="text-center mt-4">
            <input id="id_change_password" type="submit" value="Change Password" class="btn btn-primary update-btn w-100">
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="text-center mt-4">
    <a href="javascript:history.back()" class="go-back-btn">Go Back</a>
  </div>
</div>

{% endblock %}
