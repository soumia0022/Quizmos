{% extends 'base_content.html' %}
{% load system_extras %}

{% block content %}
<div class="container">

{% go_back_button %}

  <div class="row">
    <div class="col-12">
      <h1>Change password</h1>
      <form action="{% url 'user_management:password' %}" method="post">
        {% csrf_token %}
        {% include 'partials/bootstrap_form.html' with form=form %}
        <input type="submit" value="Change password" class="btn btn-primary">
      </form>
    </div>
  </div>
</div>
{% endblock %}
