{% load system_extras %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Poll</title>
    {% load static %}
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
</head>
<body>
    {% noscript_warning %}
    {% return_button %}

    {% include 'partials/background_stars.html' %}

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-lg-6 col-md-8">
                <div class="card">
                    <div class="card-header text-center bg-primary text-white">
                        <h3>Edit Poll: {{ poll.title }}</h3>
                    </div>
                    <div class="card-body">
                        <form method="POST">
                            {% csrf_token %}
                            <div class="mb-3">
                                <label for="title" class="form-label">Poll Title:</label>
                                <input type="text" id="title" name="title" class="form-control" value="{{ poll.title }}" required>
                            </div>

                            <div class="mb-3">
                                <label for="status" class="form-label">Status:</label>
                                <select id="status" name="status" class="form-select">
                                    <option value="active" {% if poll.status == "active" %}selected{% endif %}>Active</option>
                                    <option value="closed" {% if poll.status == "closed" %}selected{% endif %}>Closed</option>
                                </select>
                            </div>

                            <div class="text-center mt-4">
                                <button type="submit" class="btn btn-success">Save Changes</button>
                                <a href="{% url 'question_management:add_question' poll.id %}" class="btn btn-secondary">Edit Questions</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
