<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Poll</title>
</head>
<body>
    {% load system_extras %} <!-- When refactored, this can go under the extend base content line -->
    {% return_button %}
    <h1>Edit Poll: {{ poll.title }}</h1>
    <form method="POST">
        {% csrf_token %}
        <label for="title">Poll Title:</label>
        <input type="text" id="title" name="title" value="{{ poll.title }}" required>
        <br>
        <label for="status">Status:</label>
        <select id="status" name="status">
            <option value="active" {% if poll.status == "active" %}selected{% endif %}>Active</option>
            <option value="closed" {% if poll.status == "closed" %}selected{% endif %}>Closed</option>
        </select>
        <br>
        <button type="submit">Save Changes</button>
    </form>
    <br>
    <a href="{% url 'question_management:add_question' poll.id %}">
        <button type="button" style="background-color: #4CAF50; color: white; border: none; padding: 10px 20px; cursor: pointer;">
            Edit Questions
        </button>
    </a>
</body>
</html>
