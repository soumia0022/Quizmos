{% load system_extras %}
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <title>Edit Poll</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
    <link rel="stylesheet" href="{% static 'css/home.css' %}">
</head>
<body>
    {% noscript_warning %}
    {% return_button %}

    <!-- Background Stars & Meteors -->
    <div class="stars" id="stars-container"></div>
    <div id="meteors-container"></div>

    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row w-100">
            <div class="col-12 d-flex justify-content-center">
                <div class="card cover-card p-4 bg-dark text-white shadow-lg">
                    <h3 class="text-center mb-4">Edit Poll: {{ poll.title }}</h3>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="title" class="form-label text-white">Poll Title:</label>
                            <input type="text" id="title" name="title" class="form-control bg-secondary text-white border-0" value="{{ poll.title }}" required>
                        </div>

                        <div class="mb-3">
                            <label for="status" class="form-label text-white">Status:</label>
                            <select id="status" name="status" class="form-select bg-secondary text-white border-0">
                                <option value="active" {% if poll.status == "active" %}selected{% endif %}>Active</option>
                                <option value="closed" {% if poll.status == "closed" %}selected{% endif %}>Closed</option>
                            </select>
                        </div>

                        <div class="d-flex justify-content-center gap-3 mt-3">
                            <button type="submit" class="btn btn-success">Save Changes</button>
                            <a href="{% url 'question_management:add_question' poll.id %}" class="btn btn-secondary">Edit Questions</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="{% static 'js/space_animation.js' %}"></script>
</body>
</html>
