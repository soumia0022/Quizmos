<!DOCTYPE html>
<html lang="en">
{% load system_extras %}

<div class="row">
    <div class="col-12">
        <h1 class="dashboard-heading">Create Poll</h1>
    </div>
</div>
<body>
    {% noscript_warning %}
    <form method="post">
        {% csrf_token %}
        <label for="title">Poll Title:</label>
        <input type="text" name="title" required>
        <button type="submit">Create Poll</button>
    </form>
</body>
</html>
