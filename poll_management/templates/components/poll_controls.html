<!-- poll_controls.html -->
<div id="poll-controls">
    <button id="start-poll-btn" class="btn btn-primary mb-3">Start Poll</button>

    <div id="question-display" style="display: none;">
        <div id="question-container" class="mb-4">
            <!-- Questions will be dynamically inserted here -->
        </div>

        <div class="navigation-buttons mt-3">
            <button id="prev-btn" class="btn btn-secondary me-2" disabled>Previous</button>
            <button id="next-btn" class="btn btn-secondary">Next</button>
        </div>

        <div class="poll-progress mt-3">
            <div class="progress">
                <div id="progress-bar" class="progress-bar" role="progressbar" style="height: 100px">
                    Question <span id="current-question">1</span> of <span id="total-questions">{{ poll.questions.count }}</span>
                </div>
            </div>
        </div>
    </div>
</div>
