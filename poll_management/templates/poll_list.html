<!DOCTYPE html>
<html lang="en">
<head>
    <title>View Polls</title>


<style>

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #f9f9f9;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    
    thead {
      background-color: #4CAF50;
      color: white;
    }
    
    th, td {
      padding: 12px;
      text-align: left;
      border: 1px solid #ddd;
    }
    
    th {
      font-weight: bold;
    }
    
    tr:nth-child(even) {
      background-color: #f2f2f2;
    }
    
    tr:hover {
      background-color: #f1f1f1;
    }
    
    td a {
      color: #4CAF50;
      text-decoration: none;
      margin-right: 10px;
    }
    
    td a:hover {
      text-decoration: underline;
    }
    
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
      color: #333;
    }
    
    .container {
      padding: 20px;
    }
    </style>
</head>
<body>
    <main>
        <table>
            <thead>
                <tr>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Created At</th>
                    <th>Responses</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
              {% for poll in polls %}
              <tr>
                  <td>{{ poll.title }}</td>
                  <td>{{ poll.status }}</td>
                  <td>{{ poll.created_at|date:"Y-m-d H:i" }}</td>
                  <td>{{ poll.responses_count }}</td>
                  <td>
                      <a href="{% url 'poll_management:poll_detail' poll.id %}">View</a> | 
                      <a href="{% url 'poll_management:poll_edit' poll.id %}">Edit</a> | 
                      <a href="{% url 'poll_management:poll_delete' poll.id %}">Delete</a>
                  </td>
              </tr>
              {% empty %}
              <tr>
                  <td colspan="5">No polls found.</td>
              </tr>
              {% endfor %}
            </tbody>
        </table>
      </main>
    </div>
</body>
