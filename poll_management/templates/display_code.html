{% extends 'base_content.html' %}
{% load static %}

{% block content %}
<div class="container">
  <div class="row">
    <!-- Left Column -->
    <div class="col-6">
      <div class="left-column">
        <h1>{{ poll.title }}</h1>
        {% include 'components/poll_controls.html' %}
      </div>
    </div>

    <!-- Right Column -->
    <div class="col-6">
      <div class="right-column">
        {% include 'components/session_info.html' %}
        {% include 'components/students_list.html' %}
      </div>
    </div>
  </div>
</div>

{% block extra_js %}
<script>
  // Configuration object
  const pollConfig = {
    code: "{{ code }}",
    questions: {{ questions_json|safe }},
    wsUrl: `${window.location.protocol === 'https:' ? 'wss://' : 'ws://'}${window.location.host}/ws/poll/{{ code }}/`
  };
</script>
<script type="module" src="{% static 'js/poll/index.js' %}"></script>
{% endblock %}
{% endblock %}
