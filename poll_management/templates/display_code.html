{% extends 'base_content.html' %}
{% load system_extras %}

{% block content %}
    {% return_button %}
<div class="container">
  <div class="row">
    <div class="col-6">
      <!-- Left Column -->
      <div class="left-column">
        <h1>{{ poll.title }}</h1>
        {% include 'poll_components/lock.html' %}
        <div id="poll-controls">
          <button id="start-poll-btn" onclick="startPoll()" class="btn btn-primary mb-3">Start Poll</button>
          {% include 'poll_components/questions.html' %}

        </div>
      </div>
    </div>



        <div class="col-6">
          <div class="right-column">
            <div class="text-center mb-4">
              {% include 'poll_components/code.html' %}
            </div>
          </div>
        </div>

  </div>
</div>

<script>
  const pollCode = "{{ code }}";
  let currentQuestionIndex = 0;
  // store questions with their data depending on their type
  const questions = [
    {% for question in poll.questions.all %}
      {
        id: "{{ question.id }}",
        type: "{{ question.question_type }}",
        video_file: {% if question.video_file %}"{{ question.video_file.url }}"{% else %}null{% endif %},
        audio_file: {% if question.audio_file %}"{{ question.audio_file.url }}"{% else %}null{% endif %},
        {% if question.question_type == 'dropdown_fill' %}
          text: "{{ question.dropdown_fill_question|default:'' }}",
          options: {{ question.get_dropdown_options|safe|default:"[]" }},
        {% elif question.question_type == 'text_fill' %}
          text: "{{ question.text_fill_question|default:'' }}",
        {% elif question.question_type == 'multiple_choice' %}
          text: "{{ question.multiple_choice_question|default:'' }}",
          options: {{ question.multiple_choice_options|safe|default:"[]" }},
        {% elif question.question_type == 'single_choice' %}
          text: "{{ question.single_choice_question|default:'' }}",
          options: {{ question.single_choice_option|safe|default:"[]" }},
        {% elif question.question_type == 'wordcloud' %}
          text: "{{ question.wordcloud_question|default:'' }}",
        {% elif question.question_type == 'match_question' %}
          text: "{{ question.match_question|default:'' }}",
          options: {{ question.match_options|safe|default:"[]" }},
          answers: {{ question.match_answers|safe|default:"[]" }},
        {% endif %}
      },
    {% endfor %}
  ];

</script>
{% load static%}
<script src="{% static 'js/poll.js' %}"></script>
<script src="{% static 'js/websocket.js' %}"></script>



{% endblock %}
