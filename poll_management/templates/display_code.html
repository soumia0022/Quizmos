<!-- templates/poll_detail.html -->
{% extends 'base_content.html' %}
{% block content %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head><body>
<div class="container">
  <body class="row">
    <div class="col-6">
      <!-- Left Column -->
      <div class="left-column">
        <h1>{{ poll.title }}</h1>

        <div id="poll-controls">
          <button id="start-poll-btn" onclick="startPoll()" class="btn btn-primary mb-3">Start Poll</button>
        <h1>{{ code }}</h1>
        <img src="{{ qrcode }}" alt="QR Code for {{ poll.title }}" style="width: 200px; height: 200px;"> <!-- Initial size set to 200px -->

        <!-- Magnifying glass for enlarging the QR code -->
        <span id="magnify" style="cursor: pointer; font-size: 24px;">🔍</span>
        <div id="qrOverlay" style="display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border: 2px solid black; z-index: 1000; width: 420px; height: 420px; box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);">
          <button id="close" style="position: absolute; top: 10px; right: 10px; background: white; border: none; font-size: 20px; cursor: pointer;">✖</button>
          <img id="largeQr" src="{{ qrcode }}" style="width: 100%; height: 100%;">
        </div>




          <div id="question-display" style="display: none;">
            <div id="question-container">
              <!-- Question stuff will be here -->
            </div>
            <div class="navigation-buttons mt-3">
              <button id="prev-btn" onclick="previousQuestion()" class="btn btn-secondary me-2">Previous</button>
              <button id="next-btn" onclick="nextQuestion()" class="btn btn-secondary">Next</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right Column -->
    <div class="col-6">
      <div class="right-column">
        <div class="text-center mb-4">
          <h3>Session Code</h3>
          <h2 class="display-4">{{ code }}</h2>
          <img src="{{ qrcode }}" alt="QR Code for {{ poll.title }}" class="img-fluid mb-4" style="max-width: 200px;">
        </div>

        <div class="students-section">
          <h3>Students Joined:</h3>
          <div class="card">
            <div class="card-body">
              <ul id="students-list" class="list-unstyled">
                <!-- This list will be updated in real-time -->
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .left-column {
    padding: 20px;
    border-right: 1px solid #dee2e6;
    min-height: 100vh;
  }

  .right-column {
    padding: 20px;
  }

  .students-section {
    max-height: 400px;
    overflow-y: auto;
  }

  #students-list li {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
  }

  #students-list li:last-child {
    border-bottom: none;
  }

  .navigation-buttons {
    display: flex;
    gap: 10px;
  }

  #question-display {
    margin-top: 20px;
  }

  .question-title {
    font-size: 1.2em;
    font-weight: bold;
    margin-bottom: 1rem;
  }

  .options-container {
    margin-top: 1rem;
  }

  .option-item {
    margin: 0.5rem 0;
  }

  .dropdown-container {
    position: relative;
    display: inline-block;
  }

  .dropdown-blank {
    color: blue;
    text-decoration: underline;
    cursor: pointer;
  }

  .wordcloud-input {
    width: 100%;
    padding: 0.5rem;
    margin-top: 1rem;
  }
</style>

        <script>
          const pollCode = "{{ code }}";  <!-- Use poll primary key -->
          const ws = new WebSocket(`ws://${window.location.host}/ws/poll/${pollCode}/`);
        ws.onerror = function(error) {
    console.error("WebSocket error:", error);
  };

  ws.onclose = function(event) {
    console.log("WebSocket connection closed:", event.code, event.reason);
  };

  ws.onmessage = function(event) {// maybe change this later to have number of students joined instead of showing a list of students
    console.log("Received message:", event.data);
    const data = JSON.parse(event.data);
    if (data.type === 'message') {
      const studentsList = document.getElementById('students-list');
      const newStudent = document.createElement('li');
      newStudent.textContent = data.message;
      studentsList.appendChild(newStudent);
    }
  };
          ws.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const studentsList = document.getElementById('students-list');
            const newStudent = document.createElement('li');
            newStudent.textContent = data.message;
            studentsList.appendChild(newStudent);
          };
          // Magnifying glass functionality
          const magnifyIcon = document.getElementById('magnify');
          const qrOverlay = document.getElementById('qrOverlay');
          const closeButton = document.getElementById('close');

          magnifyIcon.addEventListener('click', function() {
            qrOverlay.style.display = 'block';
          });

          closeButton.addEventListener('click', function() {
            qrOverlay.style.display = 'none';
          });
        </script>

    </div>
  </div>
</div>
  </body>
{% endblock %}
