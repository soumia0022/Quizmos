{% extends 'base_content.html' %}
{% block content %}
<div class="container">
  <div class="row">
    <div class="col-12">
      <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
      </head>
      <body>
        <h1>{{ poll.title }}</h1>
        <h1>{{ code }}</h1>
        <img src="{{ qrcode }}" alt="QR Code for {{ poll.title }}" style="width: 200px; height: 200px;"> <!-- Initial size set to 200px -->

        <!-- Button to increase the QR code size -->
        <button id="increase-qr-size">Increase QR Size</button>

        <!-- Section to display the list of students who have joined -->
        <h2>Students Joined:</h2>
        <ul id="students-list">
          <!-- This list will be updated in real-time -->
        </ul>

        <script>
          let currentSize = 200; // Starting size (adjust as needed)

          // Get the QR code image and button
          const qrImage = document.querySelector('img[alt="QR Code for {{ poll.title }}"]');
          const button = document.getElementById('increase-qr-size');

          // Function to increase the QR size by 10
          button.addEventListener('click', function() {
            currentSize += 10; // Increase the size by 10
            qrImage.style.width = `${currentSize}px`; // Update the width of the QR code
            qrImage.style.height = `${currentSize}px`; // Update the height (keeping it square)
          });
        </script>
      </body>
    </div>
  </div>
</div>
{% endblock %}
