{% extends 'base_content.html' %}
{% block content %}
<div class="container">

  <div class="row">
    <div class="col-12">
      <h1>Welcome to {{ poll.title }}!</h1>

      <div id="question">Waiting for a question...</div>
      <input type="text" id="answer" placeholder="Your answer" />

      <div id = 'question_options'>= Waiting for options... </div>
      <button>Submit</button>

      <script>
        const pollCode = "{{ poll.number_code }}";
        const ws = new WebSocket(`ws://${window.location.host}/ws/poll/${pollCode}/`);

        ws.onmessage = function(event) {
          const data = JSON.parse(event.data);
          console.log(data);

          if (data.type === 'question') {
            document.getElementById('question').innerText = data.question.text;

            if(data.question.type == 'multiple_choice'){
              document.getElementById('question_options').innerText = data.question.mcq_options;
            
            }
            else if (data.question.type == 'single_choice'){
              document.getElementById('question_options').innerText = data.question.single_option;
            
            }
            else if (data.question.type == 'dropdown_fill'){
              document.getElementById('question_options').innerText = data.question.dropdown_options;
          }
          else if (data.question.type == 'text_fill'){
              document.getElementById('question_options').innerText = ' ';
          }
        }
        };
      </script>

    </div>
  </div>
</div>
{% endblock %}
