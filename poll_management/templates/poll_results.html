{% extends 'base_content.html' %}
{% load system_extras %}
{% block content %}
{% load static %}

<head>
    <title>{{ poll.title }}</title>
    <link rel="stylesheet" href="{% static 'poll_management/css/poll_styles.css' %}">

        <!-- CodeMirror Styles -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

    <!-- CodeMirror Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/python/python.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/javascript/javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/clike/clike.min.js"></script> <!-- For Java & C++ -->

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
    <script src="{% static 'poll_management/js/drag_and_drop.js' %}"></script>
</head>
<body>

    <div class="container" id="poll-container" data-poll-code="{{ poll.number_code }}">
        <div class="row">
            <div class="col-12">
                <h1>Welcome to {{ poll.title }}!</h1>


                <!-- progress bar  -->           
        <div class="progress rounded-pill" style="height: 30px;">
            <div id="question-progress-bar" class="progress-bar bg-success rounded-pill" role="progressbar" 
                style="width: 0%;" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                <span id="question-progress-text">0 / 0</span>
            </div>
        </div>
              <br/>

                <div id="question">
                    Waiting for a question...
                    <div class="question-timer"></div>
                </div>

                <input type="text" id="answer" style="display: none;" placeholder="Your answer" />
                <div id="question_options">Waiting for options...</div>
                <div id="feedback" class="feedback"></div>
                <div id="correct-answers" class="correct-answers" style="display: none;"></div>
                <button id="submitResponse" style="display: none;">Submit Response</button>
            </div>
        </div>

    </div>
    {% load static%}
    <script type="module" src="{% static 'js/student_lock.js' %}"></script>
    <script type="module" src="{% static 'js/timer.js' %}"></script>
    <script type="module" src="{% static 'js/student_poll_display/student_poll_display.js'%}"></script>
</body>
{% endblock %}
