{% extends 'base_content.html' %}
{% load system_extras %}
{% block content %}
<head>
  <title>{{ poll.title }}</title>
  <style>
    .container { display: flex; flex-direction: column; }
    .row { display: flex; align-items: center; }
    .left { width: 50%; }
    .box { border: 1px solid #ccc; padding: 10px; margin: 5px; }
    .dropzone-box { border: 1px dashed #ccc; padding: 10px; margin: 5px; min-height: 50px; display: flex; align-items: center; width: 50%; }
    .draggable { cursor: pointer; }
    .dragging { opacity: 0.5; }
    .flex-container { display: flex; align-items: center; justify-content: space-between; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.14.0/Sortable.min.js"></script>
</head>
<body>
    {% noscript_warning %}
  <div class="container">
    <div class="row">
      <div class="col-12">
        <h1>Welcome to {{ poll.title }}!</h1>
        <div id="question">Waiting for a question...</div>
        <input type="text" id="answer" name= "text_fill_response" placeholder="Your answer" />
        <div id="question_options">Waiting for options...</div>
        <form method="POST">
          {% csrf_token %}
          {{ form.as_p }}
          <input type="hidden" name="match_responses" id="match_responses">
          <button type="submit">Submit</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function initializeSortable() {
      const rightContainer = document.getElementById('right');

      if (rightContainer) {
        new Sortable(rightContainer, {
          group: "shared",
          animation: 150
        });
      }

      const dropzones = document.querySelectorAll('.dropzone');
      dropzones.forEach(dropzone => {
        if (dropzone) {
          new Sortable(dropzone, {
            group: "shared",
            animation: 150,
            onAdd: function(evt) {
              if (dropzone.children.length > 1) {
                const oldItem = dropzone.children[0];
                rightContainer.appendChild(oldItem);
              }
            }
          });
        }
      });
    }

    document.addEventListener('DOMContentLoaded', function() {
      const pollCode = "{{ poll.number_code }}";
      const ws = new WebSocket(`ws://${window.location.host}/ws/poll/${pollCode}/`);

      ws.onmessage = function(event) {
        const data = JSON.parse(event.data);

        document.getElementById('answer').style.display = 'none';

        if (data.type === 'question') {
          document.getElementById('question').innerText = data.question.text;

          if (data.question.type === 'multiple_choice') {
            let options = "";
            data.question.mcq_options.forEach(option => {
              options += `<input type="checkbox" name="multiple_choice_answers[]" value="${option}"><label>${option}</label><br>`;
            });
            document.getElementById('question_options').innerHTML = options;

          } else if (data.question.type === 'single_choice') {
            let options = "";
            data.question.single_option.forEach(option => {
              options += `<input type="radio" name="single_choice_answer" value="${option}"><label>${option}</label><br>`;
            });
            document.getElementById('question_options').innerHTML = options;
          } else if (data.question.type === 'dropdown_fill') {
            let options = '<select name="dropdown_answer"><option value="" disabled selected>Select an option</option>';
            data.question.dropdown_options.forEach(option => {
              options += `<option value="${option}">${option}</option>`;
            });
            if (!data.question.dropdown_options.includes(data.question.dropdown_correct_answer)) {
              options += `<option value="${data.question.dropdown_correct_answer}">${data.question.dropdown_correct_answer}</option>`;
            }
            options += '</select>';
            document.getElementById('question_options').innerHTML = options;
          } else if (data.question.type === 'text_fill') {
            document.getElementById('question_options').innerHTML = '';
            document.getElementById('answer').style.display = 'block'; 
          } else if (data.question.type === 'match_question') {
            let leftOptions = "";
            let rightOptions = "";

            data.question.match_options.forEach((option) => {
                leftOptions += `
                    <div class="flex-container">
                        <div class="box left">${option}</div>
                        <div class="dropzone-box dropzone right"></div>
                    </div>`;
            });

            const shuffledAnswers = shuffleArray(data.question.match_answers);

            shuffledAnswers.forEach(answer => {
                rightOptions += `<div class="box draggable" draggable="true">${answer}</div>`;
            });

            document.getElementById('question_options').innerHTML = `
                <div id="options-container" class="flex-container">
                  <div id="left" class="left">${leftOptions}</div>
                </div>
                <div class="row">
                  <div id="right" class="right">${rightOptions}</div>
                </div>`;

            initializeSortable();
          }
        }
      };

      const form = document.querySelector('form');
      form.addEventListener('submit', function(event) {
        const matchResponses = [];

        const dropzones = document.querySelectorAll('.dropzone');
        dropzones.forEach((dropzone) => {
          const leftOption = dropzone.parentElement.querySelector('.left .box');
          const rightOption = dropzone.querySelector('.box');
          if (leftOption && rightOption) {
            matchResponses.push({
              left: leftOption.textContent.trim(),
              right: rightOption.textContent.trim()
            });
          }
        });

        const matchResponsesInput = document.getElementById('match_responses');
        if (matchResponsesInput) {
          matchResponsesInput.value = JSON.stringify(matchResponses);
        }
   
        const multipleChoiceResponses = [];
        const checkboxes = document.querySelectorAll('input[name="multiple_choice_answers[]"]:checked');
        checkboxes.forEach((checkbox) => {
          multipleChoiceResponses.push(checkbox.value);
        });

       
        const multipleChoiceInput = document.createElement('input');
        multipleChoiceInput.type = 'hidden';
        multipleChoiceInput.name = 'multiple_choice_responses';
        multipleChoiceInput.value = JSON.stringify(multipleChoiceResponses);
        form.appendChild(multipleChoiceInput);

     
        const singleChoiceResponse = document.querySelector('input[name="single_choice_answer"]:checked');
        const singleChoiceInput = document.createElement('input');
        singleChoiceInput.type = 'hidden';
        singleChoiceInput.name = 'single_choice_response';
        if (singleChoiceResponse) {
          singleChoiceInput.value = singleChoiceResponse.value;
        }
        form.appendChild(singleChoiceInput);

        const dropdownFillResponse = document.querySelector('select[name="dropdown_answer"]');
        const dropdownFillInput = document.createElement('input');
        dropdownFillInput.type = 'hidden';
        dropdownFillInput.name = 'dropdown_response';
        if (dropdownFillResponse && dropdownFillResponse.value) {
          dropdownFillInput.value = dropdownFillResponse.value;
        }
        form.appendChild(dropdownFillInput);

        const textFillResponse = document.querySelector('input[name="text_fill_response"]');
        const textFillInput = document.createElement('input');
        textFillInput.type = 'hidden';
        textFillInput.name = 'text_fill_response';
        if (textFillResponse) {
          textFillInput.value = textFillResponse.value;
        }
        form.appendChild(textFillInput);


      });
    });
  </script>
</body>
{% endblock %}
