{% load system_extras %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Results</title>
    {% return_button %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Layout styles */
        .container {
            display: flex;
            justify-content: space-between;
        }

        /* Sidebar styles */
        .sidebar {
            width: 30%;
            background-color: #f8f9fa;
            padding: 20px;
            border-right: 2px solid #ddd;
        }

        .question-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .question-item:hover {
            background-color: #e9ecef;
        }

        .chart-container {
            width: 80%;
            max-width: 800px;
            height: 500px;
            margin: 0 auto; /* Centres the chart */
        }


        canvas {
            width: 100% !important;
            height: 100% !important;
            max-width: 800px;
            max-height: 500px;
        }


        /* Button styles */
        .button-container {
            margin-top: 10px;
            text-align: center;
        }

        button {
            margin: 5px;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar for Questions -->
        <div class="sidebar">
            <h3 class="text-center">Questions</h3>
            <div id="questions-list">
                {% for question in poll.questions.all %}
                    <div class="question-item" data-question-id="{{ question.id }}">
                        <strong>Q{{ forloop.counter }}:</strong> {{ question.question_text }}
                        <button class="view-analytics-btn" data-question-id="{{ question.id }}">View Analytics</button>
                    </div>
                {% empty %}
                    <p class="text-muted text-center">No questions created yet.</p>
                {% endfor %}
            </div>
        </div>

        <!-- Chart Container -->
        <div class="chart-container">
            <h2 id="selected-question-title">Select a question to view analytics</h2>

            <button id="viewPollResults">Show Poll Results</button>
            <div class="button-container">
                <button id="viewPieChart">View Pie Chart</button>
                <button id="viewBarGraph">View Bar Graph</button>
                <button id="viewLineGraph">View Line Graph</button>
            </div>

            <canvas id="chart"></canvas>
        </div>
    </div>

    <script>
        // Get the canvas element and its context
        var ctx = document.getElementById('chart').getContext('2d');
        var chartInstance = null;
        var selectedQuestionId = null;  // Track the selected question

        // Function to clear the existing chart
        function clearChart() {
            if (chartInstance) {
                chartInstance.destroy();
            }
        }

        // Function to generate a random color for charts
        function generateRandomColor() {
            var letters = '0123456789ABCDEF';
            var color = '#';
            for (var i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        // Function to fetch and display pie chart
        function showPieChart() {
            clearChart(); // Clear previous chart

            let url = selectedQuestionId
                ? `/responses/questions/${selectedQuestionId}/analytics/?type=pie`
                : `/responses/polls/{{ poll.id }}/piechart_data/`;

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Pie chart data not found.");
                    return response.json();
                })
                .then(data => {
                    chartInstance = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                data: data.data,
                                backgroundColor: data.labels.map(() => generateRandomColor()) // Assign unique colors
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                title: {
                                    display: true,
                                    text: selectedQuestionId
                                        ? `Analytics for Question: ${data.question}`
                                        : "Total Number of Responses",
                                    font: { size: 22, weight: 'bold' }
                                },
                                legend: {
                                    labels: { font: { size: 14 } }
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error("Error fetching pie chart data:", error));
        }


        function showBarGraph() {
            clearChart();

            let url = selectedQuestionId
                ? `/responses/questions/${selectedQuestionId}/analytics/?type=bar`
                : `/responses/polls/{{ poll.id }}/bargraph_data/`;

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Bar graph data not found.");
                    return response.json();
                })
                .then(data => {
                    chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Responses',
                                data: data.data,
                                backgroundColor: "#800080"
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { font: { size: 14 } }
                                },
                                x: {
                                    ticks: { font: { size: 14 } }
                                }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: selectedQuestionId
                                        ? `Analytics for Question: ${data.question}`
                                        : "Total Number of Responses (Bar Chart)",
                                    font: { size: 22, weight: 'bold' }
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error("Error fetching bar chart data:", error));
        }


        function showLineGraph() {
            clearChart();

            let url = selectedQuestionId
                ? `/responses/questions/${selectedQuestionId}/analytics/?type=line`
                : `/responses/polls/{{ poll.id }}/linegraph_data/`;

            fetch(url)
                .then(response => {
                    if (!response.ok) throw new Error("Line graph data not found.");
                    return response.json();
                })
                .then(data => {
                    chartInstance = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Responses',
                                data: data.data,
                                borderColor: "#3d073e",
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: { font: { size: 14 } }
                                },
                                x: {
                                    ticks: { font: { size: 14 } }
                                }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: selectedQuestionId
                                        ? `Analytics for Question: ${data.question}`
                                        : "Total Number of Responses (Line Graph)",
                                    font: { size: 22, weight: 'bold' }
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error("Error fetching line graph data:", error));
        }

        // Show overall poll results
        function showPollResults() {
            selectedQuestionId = null; // Reset question selection
            document.getElementById('selected-question-title').innerText = "Poll Results";

            showPieChart(); // Default to pie chart when viewing poll results
        }


        document.getElementById('viewPieChart').addEventListener('click', showPieChart);
        document.getElementById('viewBarGraph').addEventListener('click', showBarGraph);
        document.getElementById('viewLineGraph').addEventListener('click', showLineGraph);
        document.getElementById('viewPollResults').addEventListener('click', showPollResults);

        // When a question is clicked, load pie chart
        document.querySelectorAll('.question-item').forEach(item => {
            item.addEventListener('click', function () {
                selectedQuestionId = this.getAttribute('data-question-id');
                document.getElementById('selected-question-title').innerText = `Analytics for Question ${selectedQuestionId}`;
                showPieChart(); // Load pie chart for the selected question by default
            });
        });

        // default on page load
        document.addEventListener("DOMContentLoaded", showPieChart);

    </script>

</body>
</html>
