{% load system_extras %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poll Results</title>
    {% return_button %}
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        /* Layout styles */
        .container {
            display: flex;
            justify-content: space-between;
        }

        /* Sidebar styles */
        .sidebar {
            width: 30%;
            background-color: #f8f9fa;
            padding: 20px;
            border-right: 2px solid #ddd;
        }

        .question-item {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .question-item:hover {
            background-color: #e9ecef;
        }

        /* Chart section */
        .chart-container {
            width: 70%;
            padding: 20px;
        }

        canvas {
            width: 100% !important;
            height: 400px !important;
        }

        /* Button styles */
        .button-container {
            margin-top: 10px;
            text-align: center;
        }

        button {
            margin: 5px;
            padding: 8px 15px;
            font-size: 14px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Sidebar for Questions -->
        <div class="sidebar">
            <h3 class="text-center">Questions</h3>
            <div id="questions-list">
                {% for question in poll.questions.all %}
                    <div class="question-item" data-question-id="{{ question.id }}">
                        <strong>Q{{ forloop.counter }}:</strong> {{ question.question_text }}
                        <button class="view-analytics-btn" data-question-id="{{ question.id }}">View Analytics</button>
                    </div>
                {% empty %}
                    <p class="text-muted text-center">No questions created yet.</p>
                {% endfor %}
            </div>
        </div>

        <!-- Chart Container -->
        <div class="chart-container">
            <h2 id="selected-question-title">Select a question to view analytics</h2>

            <button id="viewPollResults">Show Poll Results</button>
            <div class="button-container">
                <button id="viewPieChart">View Pie Chart</button>
                <button id="viewBarGraph">View Bar Graph</button>
                <button id="viewLineGraph">View Line Graph</button>
            </div>

            <canvas id="chart"></canvas>
        </div>
    </div>

    <script>
        var ctx = document.getElementById('chart').getContext('2d');
        var chartInstance = null;
        var selectedQuestionId = null;  // Track the selected question

        function clearChart() {
            if (chartInstance) {
                chartInstance.destroy();
            }
        }

        function fetchAndShowChart(chartType) {
            if (!selectedQuestionId) {
                // Don't show the error when viewing poll results - will not require this
                if (document.getElementById('selected-question-title').innerText !== "Poll Results") {
                    alert("Please select a question first!");
                    return;
                }
            }

            let url = selectedQuestionId
                ? `/responses/questions/${selectedQuestionId}/analytics/?type=${chartType}`
                : `/responses/polls/{{ poll.id }}/${chartType}_data/`; // Use the correct poll-level URL


            fetch(url)
                .then(response => response.json())
                .then(data => {
                    clearChart();

                    chartInstance = new Chart(ctx, {
                        type: chartType,
                        data: {
                            labels: data.labels,
                            datasets: [{
                                data: data.data,
                                backgroundColor: data.labels.map(() => generateRandomColor()),
                                borderColor: '#3d073e',
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { beginAtZero: true }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: selectedQuestionId ? `Analytics for Question: ${data.question}` : "Total Responses",
                                    font: { size: 18 }
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error("Error fetching analytics:", error));
        }


        function generateRandomColor() {
            var letters = '0123456789ABCDEF';
            var color = '#';
            for (var i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }

        document.querySelectorAll('.view-analytics-btn').forEach(button => {
            button.addEventListener('click', function () {
                selectedQuestionId = this.getAttribute('data-question-id');
                document.getElementById('selected-question-title').innerText = `Analytics for Question ${selectedQuestionId}`;

                // Clear old chart when a new question is selected
                clearChart();
            });
        });

        document.getElementById('viewPieChart').addEventListener('click', () => fetchAndShowChart('pie'));
        document.getElementById('viewBarGraph').addEventListener('click', () => fetchAndShowChart('bar'));
        document.getElementById('viewLineGraph').addEventListener('click', () => fetchAndShowChart('line'));

        // Show poll results when the button is clicked
        document.getElementById('viewPollResults').addEventListener('click', function () {
            selectedQuestionId = null;
            document.getElementById('selected-question-title').innerText = "Poll Results";

            fetch(`/responses/poll/analytics/`)
                .then(response => response.json())
                .then(data => {
                    clearChart();

                    chartInstance = new Chart(ctx, {
                        type: 'bar', // Default type for poll results
                        data: {
                            labels: data.labels,
                            datasets: [{
                                data: data.data,
                                backgroundColor: data.labels.map(() => generateRandomColor()),
                                borderColor: '#3d073e',
                                fill: false
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            scales: {
                                y: { beginAtZero: true }
                            },
                            plugins: {
                                title: {
                                    display: true,
                                    text: "Overall Poll Results",
                                    font: { size: 18 }
                                }
                            }
                        }
                    });
                })
                .catch(error => console.error("Error fetching poll results:", error));
        });

    </script>

</body>
</html>
